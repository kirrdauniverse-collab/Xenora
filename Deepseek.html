<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>XENORA — Városépítő Szimulátor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05030f;--panel:#120c28;--cyan:#4fe3ff;--magenta:#ff4fd8;--gold:#ffd166;--green:#4fff8f;--text:#e8e6ff;--dim:#8b86b8;--line:rgba(79,227,255,.18);}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Rajdhani',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#menuParticles{position:fixed;inset:0;z-index:1;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(124,86,232,.20),transparent 60%),
    radial-gradient(ellipse at 80% 90%,rgba(255,79,216,.14),transparent 55%),
    radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.78) 100%);}
#menu{position:fixed;inset:0;z-index:10;display:grid;grid-template-columns:1fr 340px;align-items:center;gap:40px;padding:40px clamp(24px,5vw,80px);transition:opacity .5s ease;}
#menu.hidden{opacity:0;pointer-events:none}
@media (max-width:900px){#menu{grid-template-columns:1fr;padding:24px}#menu .preview-card{display:none}}
.hero{margin-bottom:36px;animation:fadeUp .8s ease both}
.logo-mark{display:inline-block;font-size:34px;color:var(--cyan);text-shadow:0 0 24px rgba(79,227,255,.9),0 0 60px rgba(79,227,255,.4);margin-bottom:8px;animation:float 4s ease-in-out infinite}
.title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(44px,8vw,84px);letter-spacing:.18em;line-height:1;
  background:linear-gradient(100deg,#fff 0%,var(--cyan) 30%,var(--magenta) 60%,#fff 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(79,227,255,.4));animation:shimmer 6s linear infinite;}
.subtitle{margin-top:14px;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.subtitle b{color:var(--cyan);font-weight:600}
.main-menu{display:flex;flex-direction:column;gap:11px;max-width:520px}
.menu-btn{position:relative;display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:16px;padding:15px 22px;text-align:left;font-family:inherit;color:var(--text);cursor:pointer;border-radius:14px;border:1px solid rgba(139,134,184,.18);background:linear-gradient(120deg,rgba(18,12,40,.78),rgba(18,12,40,.42));backdrop-filter:blur(12px);overflow:hidden;transition:transform .25s cubic-bezier(.3,1.4,.5,1),border-color .25s,box-shadow .25s;animation:fadeUp .55s ease both;}
.menu-btn::before{content:'';position:absolute;inset:0;border-radius:14px;background:linear-gradient(120deg,transparent 40%,rgba(79,227,255,.15) 50%,transparent 60%);transform:translateX(-100%);transition:transform .6s ease;}
.menu-btn:hover::before{transform:translateX(100%)}
.menu-btn:nth-child(1){animation-delay:.05s}.menu-btn:nth-child(2){animation-delay:.10s}.menu-btn:nth-child(3){animation-delay:.15s}
.menu-btn:nth-child(4){animation-delay:.20s}.menu-btn:nth-child(5){animation-delay:.25s}.menu-btn:nth-child(6){animation-delay:.30s}
.menu-btn .icon{font-size:20px;color:var(--cyan);text-shadow:0 0 14px rgba(79,227,255,.8);justify-self:center;transition:transform .3s}
.menu-btn:hover .icon{transform:scale(1.15) rotate(-5deg)}
.menu-btn .text{display:flex;flex-direction:column;gap:2px}
.menu-btn .label{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:.08em}
.menu-btn .hint{font-size:12.5px;color:var(--dim);letter-spacing:.04em}
.menu-btn .arrow{font-size:26px;color:var(--dim);transition:transform .25s,color .25s;line-height:1}
.menu-btn:hover{transform:translateX(10px);border-color:var(--cyan);box-shadow:0 0 0 1px rgba(79,227,255,.3),0 16px 40px rgba(79,227,255,.2)}
.menu-btn:hover .arrow{transform:translateX(8px);color:var(--cyan)}
.menu-btn.primary{border-color:rgba(255,79,216,.4);background:linear-gradient(120deg,rgba(255,79,216,.18),rgba(79,227,255,.08))}
.menu-btn.primary .icon{color:var(--magenta);text-shadow:0 0 14px rgba(255,79,216,.9)}
.menu-btn.primary:hover{border-color:var(--magenta);box-shadow:0 0 0 1px rgba(255,79,216,.4),0 16px 40px rgba(255,79,216,.25)}
.preview-card{position:relative;padding:26px 22px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(24,16,52,.8),rgba(13,8,32,.7));backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:fadeUp .8s ease .3s both;text-align:center;}
.preview-card .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.28em;padding:5px 14px;border-radius:999px;color:#05030f;font-weight:700;background:linear-gradient(100deg,var(--cyan),var(--magenta));}
.preview-card .avatar-wrap{width:130px;height:130px;margin:8px auto 14px;position:relative;display:grid;place-items:center}
.preview-card .avatar-wrap::before{content:'';position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,var(--pc,#4fe3ff)22,transparent 70%);animation:pulse 3s ease-in-out infinite;}
.preview-card .avatar{width:110px;position:relative;z-index:1}
.preview-card h3{font-family:'Orbitron',sans-serif;font-size:17px;letter-spacing:.05em;margin-bottom:4px}
.preview-card .meta{font-size:13px;color:var(--dim);letter-spacing:.06em;margin-bottom:18px}
.preview-card .trait-mini{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:20px}
.preview-card .trait-mini .t{display:grid;grid-template-columns:1fr 36px;gap:10px;align-items:center;font-size:12px}
.preview-card .trait-mini .t .name{color:var(--dim);letter-spacing:.04em}
.preview-card .trait-mini .t .track{height:4px;border-radius:3px;background:rgba(139,134,184,.2);overflow:hidden;margin-top:3px}
.preview-card .trait-mini .t .fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));border-radius:3px}
.preview-card .trait-mini .t .v{color:var(--cyan);font-weight:600;text-align:right;font-family:'Orbitron',sans-serif;font-size:12px}
.preview-card .btn-edit{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.16em;padding:10px 20px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--cyan);transition:.2s;width:100%;}
.preview-card .btn-edit:hover{background:rgba(79,227,255,.1);border-color:var(--cyan)}
.version{margin-top:40px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(139,134,184,.55);animation:fadeUp 1s ease both}

.screen-layer{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(5,3,15,.78);backdrop-filter:blur(12px)}
.screen-layer.open{display:grid;animation:fadeIn .25s ease}
.screen-panel{position:relative;width:min(880px,100%);max-height:88vh;overflow-y:auto;padding:34px clamp(22px,4vw,46px);border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(24,16,52,.98),rgba(13,8,32,.98));box-shadow:0 40px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);animation:panelIn .35s cubic-bezier(.2,.9,.3,1.3) both;}
.screen-panel::-webkit-scrollbar{width:8px}.screen-panel::-webkit-scrollbar-thumb{background:rgba(79,227,255,.3);border-radius:4px}
.screen-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;border:1px solid rgba(139,134,184,.25);background:transparent;color:var(--dim);font-size:15px;cursor:pointer;transition:.2s}
.screen-close:hover{color:#fff;border-color:var(--magenta);background:rgba(255,79,216,.15);transform:rotate(90deg)}
.screen-title{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);margin-bottom:20px;display:flex;align-items:center;gap:10px}
.screen-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.screen-head h2{font-family:'Orbitron',sans-serif;font-size:clamp(22px,3.4vw,30px);letter-spacing:.04em;margin-bottom:10px}
.screen-head p{color:var(--dim);font-size:15px;max-width:62ch;margin-bottom:26px;line-height:1.55}
.screen-body{display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:10px}
.field-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.field input[type="text"]{font-family:inherit;font-size:17px;color:var(--text);padding:12px 16px;border-radius:11px;border:1px solid rgba(139,134,184,.25);background:rgba(5,3,15,.6);outline:none;transition:.2s}
.field input[type="text"]:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,227,255,.15)}
.chip-row{display:flex;flex-wrap:wrap;gap:9px}
.chip{font-family:inherit;font-size:13.5px;letter-spacing:.05em;padding:9px 18px;border-radius:999px;border:1px solid rgba(139,134,184,.28);background:rgba(5,3,15,.5);color:var(--dim);cursor:pointer;transition:.18s}
.chip:hover{color:var(--text);border-color:rgba(79,227,255,.5);transform:translateY(-1px)}
.chip.active{color:#05030f;font-weight:700;border-color:transparent;background:linear-gradient(100deg,var(--cyan),#8ef0ff);box-shadow:0 0 22px rgba(79,227,255,.4)}
.screen-foot{display:flex;justify-content:flex-end;gap:12px;margin-top:30px;padding-top:24px;border-top:1px solid rgba(139,134,184,.15)}
.btn{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.14em;padding:13px 30px;border-radius:11px;cursor:pointer;border:1px solid rgba(139,134,184,.3);background:transparent;color:var(--text);transition:.2s}
.btn.ghost:hover{border-color:var(--dim);background:rgba(255,255,255,.05)}
.btn.primary{border:none;color:#05030f;font-weight:700;background:linear-gradient(100deg,var(--cyan),var(--magenta));box-shadow:0 10px 34px rgba(79,227,255,.32)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 14px 42px rgba(255,79,216,.45)}
.profile-layout{display:grid;grid-template-columns:240px 1fr;gap:34px}
@media (max-width:700px){.profile-layout{grid-template-columns:1fr}}
.profile-preview{text-align:center;padding:24px 16px;border-radius:18px;border:1px solid rgba(139,134,184,.16);background:rgba(5,3,15,.5)}
.avatar{width:120px;margin:0 auto 14px;position:relative}
.alien{width:100%;height:auto;filter:drop-shadow(0 0 24px var(--c))}
.profile-preview h3{font-family:'Orbitron',sans-serif;font-size:17px;letter-spacing:.05em}
.profile-preview .dim{color:var(--dim);font-size:13px;margin-top:4px}
.trait-bars{margin-top:20px;display:flex;flex-direction:column;gap:9px;text-align:left}
.trait{display:grid;grid-template-columns:1fr 70px 32px;align-items:center;gap:8px;font-size:12px}
.trait-name{color:var(--dim);letter-spacing:.04em}
.trait-track{height:5px;border-radius:3px;background:rgba(139,134,184,.2);overflow:hidden}
.trait-fill{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width .2s}
.trait-val{text-align:right;color:var(--cyan);font-weight:600}
.profile-form{display:flex;flex-direction:column;gap:20px}
.sliders{display:flex;flex-direction:column;gap:14px}
.slider-row{display:grid;grid-template-columns:1fr 160px 40px;align-items:center;gap:14px;font-size:13.5px}
.slider-row label{color:var(--dim);letter-spacing:.04em}
.slider-row output{text-align:right;color:var(--cyan);font-weight:600;font-family:'Orbitron',sans-serif;font-size:12px}
input[type="range"]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:rgba(139,134,184,.25);outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px rgba(79,227,255,.9);cursor:pointer;transition:transform .15s}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type="range"]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px rgba(79,227,255,.9);cursor:pointer}
input[type="color"]{width:64px;height:40px;border:1px solid rgba(139,134,184,.3);border-radius:10px;background:transparent;cursor:pointer;padding:3px}
.empty-state{text-align:center;padding:56px 20px;color:var(--dim);border:1px dashed rgba(139,134,184,.25);border-radius:18px}
.empty-state .big{font-size:44px;display:block;margin-bottom:14px;opacity:.5}

#game{position:fixed;inset:0;z-index:20;display:none}
#game.on{display:block}
#city{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.hud{position:absolute;z-index:5;pointer-events:none}
.hud.top{top:0;left:0;right:0;padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,rgba(5,3,15,.9),rgba(5,3,15,0))}
.stat{pointer-events:auto;display:flex;flex-direction:column;gap:2px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(18,12,40,.88);backdrop-filter:blur(12px);min-width:100px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.stat .label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.stat .val{font-family:'Orbitron',sans-serif;font-weight:700;font-size:17px;color:var(--cyan);display:flex;align-items:center;gap:6px}
.stat .val small{font-size:11px;opacity:.7;font-weight:400}
.stat.gold .val{color:var(--gold)}.stat.mag .val{color:var(--magenta)}.stat.green .val{color:var(--green)}
.stat.warn .val{color:#ff7a5a;animation:warnPulse 1s infinite}
#dayBadge{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(18,12,40,.88);backdrop-filter:blur(12px);font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.12em;color:var(--cyan);box-shadow:0 6px 20px rgba(0,0,0,.4)}
#dayBadge .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:.5s}
#btnMenu{pointer-events:auto;margin-left:auto;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.16em;padding:11px 20px;border-radius:12px;cursor:pointer;border:1px solid rgba(139,134,184,.3);background:rgba(18,12,40,.88);color:var(--text);backdrop-filter:blur(12px);transition:.2s}
#btnMenu:hover{border-color:var(--magenta);background:rgba(255,79,216,.18);transform:translateY(-1px)}
.hud.bottom{bottom:0;left:0;right:0;padding:14px 18px 22px;display:flex;flex-direction:column;gap:8px;align-items:center;background:linear-gradient(0deg,rgba(5,3,15,.92),rgba(5,3,15,0))}
.cat-tabs{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:14px;border:1px solid var(--line);background:rgba(18,12,40,.92);backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.5);overflow-x:auto;max-width:100%;}
.cat-tab{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--dim);cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:.06em;font-weight:600;transition:.18s;flex-shrink:0}
.cat-tab .ico{font-size:15px;line-height:1}
.cat-tab:hover{color:var(--text);background:rgba(79,227,255,.08)}
.cat-tab.active{color:#05030f;background:linear-gradient(135deg,var(--cyan),var(--magenta));box-shadow:0 0 18px rgba(79,227,255,.4);font-weight:700}
.tools{pointer-events:auto;display:flex;gap:6px;padding:8px;border-radius:16px;border:1px solid var(--line);background:rgba(18,12,40,.92);backdrop-filter:blur(14px);overflow-x:auto;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.7)}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;padding:10px 8px;border-radius:11px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--dim);font-family:inherit;transition:.18s;flex-shrink:0}
.tool .ico{font-size:20px;line-height:1;transition:transform .2s}
.tool .lbl{font-size:10.5px;letter-spacing:.06em;font-family:'Rajdhani',sans-serif;font-weight:600;text-align:center;line-height:1.1}
.tool .cost{font-size:10px;opacity:.75;font-weight:600}
.tool .badge{position:absolute;top:3px;right:3px;font-size:8.5px;padding:1px 4px;border-radius:4px;background:rgba(79,227,255,.22);color:var(--cyan);font-weight:700;letter-spacing:0;font-family:'Orbitron',sans-serif}
.tool:hover{color:var(--text);background:rgba(79,227,255,.08);border-color:rgba(79,227,255,.25)}
.tool:hover .ico{transform:scale(1.15)}
.tool.active{color:#05030f;background:linear-gradient(135deg,var(--cyan),var(--magenta));border-color:transparent;box-shadow:0 0 26px rgba(79,227,255,.5);transform:translateY(-2px)}
.tool.active .badge{background:rgba(5,3,15,.35);color:#05030f}
.tool.disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:13px;color:var(--dim);letter-spacing:.06em;padding:6px 18px;border-radius:999px;background:rgba(5,3,15,.75);border:1px solid var(--line);backdrop-filter:blur(10px);min-height:28px;text-align:center;transition:.2s}
#gameControls{position:absolute;top:76px;right:18px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:340px}
.wbtn{pointer-events:auto;padding:8px 12px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:rgba(18,12,40,.88);color:var(--dim);font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:.14em;transition:.2s;backdrop-filter:blur(12px)}
.wbtn:hover{color:var(--text);border-color:var(--cyan);transform:translateY(-1px)}
.wbtn.active{color:#05030f;background:linear-gradient(135deg,var(--cyan),var(--magenta));border-color:transparent;font-weight:700}
#toast{position:fixed;bottom:34px;left:50%;transform:translate(-50%,30px);z-index:40;padding:14px 28px;border-radius:12px;font-size:14.5px;letter-spacing:.05em;color:var(--text);border:1px solid var(--line);background:rgba(18,12,40,.97);box-shadow:0 20px 50px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.35s;backdrop-filter:blur(12px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes panelIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes warnPulse{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  .menu-btn{grid-template-columns:30px 1fr auto;padding:13px 16px}
  .menu-btn .hint{display:none}
  .screen-foot{flex-direction:column-reverse}.btn{width:100%}
  .stat{padding:7px 12px;min-width:82px}.stat .val{font-size:14px}
  .tool{min-width:64px;padding:8px 6px}.tool .ico{font-size:17px}.tool .lbl{font-size:9.5px}
  .cat-tab{padding:6px 10px;font-size:11px}
  #gameControls{top:auto;bottom:96px;right:8px;max-width:200px}
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<canvas id="menuParticles"></canvas>
<div class="vignette"></div>

<div id="menu">
  <div class="menu-left">
    <header class="hero">
      <div class="logo-mark">◈</div>
      <h1 class="title">XENORA</h1>
      <p class="subtitle">Városépítő szimulátor · <b>idegen bolygó</b></p>
    </header>
    <nav class="main-menu" id="mainMenu">
      <button class="menu-btn primary" data-screen="new-game"><span class="icon">✦</span><span class="text"><span class="label">Új játék</span><span class="hint">Alapítsd meg Xenorát</span></span><span class="arrow">›</span></button>
      <button class="menu-btn" data-screen="load"><span class="icon">⟲</span><span class="text"><span class="label">Játék betöltése</span><span class="hint">Mentett városok</span></span><span class="arrow">›</span></button>
      <button class="menu-btn" data-screen="profile"><span class="icon">◉</span><span class="text"><span class="label">Profil készítő</span><span class="hint">A te karaktered</span></span><span class="arrow">›</span></button>
      <button class="menu-btn" data-screen="settings"><span class="icon">⚙</span><span class="text"><span class="label">Beállítások</span><span class="hint">Hang · Grafika · Játékmenet</span></span><span class="arrow">›</span></button>
      <button class="menu-btn" data-screen="new-game" data-mode="offline"><span class="icon">☾</span><span class="text"><span class="label">Offline játék</span><span class="hint">Egyedül, saját tempóban</span></span><span class="arrow">›</span></button>
      <button class="menu-btn" data-screen="online"><span class="icon">⬡</span><span class="text"><span class="label">Online játék</span><span class="hint">Más játékosokkal</span></span><span class="arrow">›</span></button>
    </nav>
    <footer class="version">v0.6.0 · Alpha build · Xenora Projekt</footer>
  </div>
  <aside class="preview-card" id="previewCard">
    <div class="tag">JÁTÉKOS</div>
    <div class="avatar-wrap" id="previewAvatarWrap" style="--pc:#4fe3ff"><div class="avatar" id="previewAvatar"></div></div>
    <h3 id="previewName">Névtelen</h3>
    <p class="meta" id="previewMeta">30 éves · Közepes</p>
    <div class="trait-mini" id="previewTraits"></div>
    <button class="btn-edit" id="btnEditProfile">PROFIL SZERKESZTÉSE</button>
  </aside>
</div>

<div id="game">
  <canvas id="city"></canvas>
  <div class="hud top">
    <div class="stat gold"><span class="label">Kredit</span><span class="val" id="statMoney">0</span></div>
    <div class="stat"><span class="label">Lakosság</span><span class="val" id="statPop">0</span></div>
    <div class="stat mag"><span class="label">Energia</span><span class="val" id="statPower">0/0</span></div>
    <div class="stat green"><span class="label">Boldogság</span><span class="val" id="statHappy">50%</span></div>
    <div id="dayBadge"><span class="dot" id="dayDot"></span><span id="dayText">NAPPAL</span></div>
    <button id="btnMenu">MENÜ</button>
  </div>
  <div id="gameControls">
    <button class="wbtn" data-weather="clear">☀ TISZTA</button>
    <button class="wbtn" data-weather="rain">☂ ESŐ</button>
    <button class="wbtn" data-weather="snow">❄ HÓ</button>
    <button class="wbtn" data-weather="fog">☁ KÖD</button>
  </div>
  <div class="hud bottom">
    <div class="cat-tabs" id="catTabs"></div>
    <div class="tools" id="tools"></div>
    <div class="hint" id="toolHint">Válassz egy kategóriát, majd egy elemet.</div>
  </div>
</div>

<div class="screen-layer" id="screenLayer" aria-hidden="true"><div class="screen-panel" id="screenPanel"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   XENORA v0.6.0 — kategóriák + több csempés épületek
   ============================================================ */

/* ---------- Helpers ---------- */
let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800);}
function alienSVG(){return `<svg viewBox="0 0 120 130" class="alien" aria-hidden="true">
  <line x1="60" y1="26" x2="60" y2="9" stroke="var(--c)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="7" r="5" fill="var(--c)"/>
  <ellipse cx="60" cy="64" rx="36" ry="42" fill="var(--c)" opacity="0.88"/>
  <ellipse cx="60" cy="74" rx="36" ry="32" fill="#05030f" opacity="0.22"/>
  <ellipse cx="46" cy="62" rx="11" ry="14" fill="#05030f"/>
  <ellipse cx="74" cy="62" rx="11" ry="14" fill="#05030f"/>
  <circle cx="48.5" cy="58" r="3.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="76.5" cy="58" r="3.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="48" cy="57" r="1.2" fill="var(--c)"/>
  <circle cx="76" cy="57" r="1.2" fill="var(--c)"/>
</svg>`;}
function shade(hex,amt){if(hex.startsWith('rgb')){const m=hex.match(/\d+/g).map(Number);return `rgb(${clamp(m[0]+amt*255)},${clamp(m[1]+amt*255)},${clamp(m[2]+amt*255)})`;}const c=hex.replace('#','');let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return `rgb(${clamp(r+amt*255)},${clamp(g+amt*255)},${clamp(b+amt*255)})`;}
function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgba(c,a){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}

/* ---------- State ---------- */
const TRAIT_LABELS={nyitottsag:'Nyitottság',szocialis:'Szociális energia',ambicio:'Ambíció',nyugalom:'Kiegyensúlyozottság'};
const state={
  profile:{name:'Névtelen',age:30,body:'Közepes',orientation:['Mindenkire'],traits:{nyitottsag:70,szocialis:60,ambicio:50,nyugalom:50},color:'#4fe3ff'},
  settings:{music:70,sfx:80,quality:'közepes',timeSpeed:1},
  saveSlots:[]
};

/* ---------- Starfield ---------- */
const sCanvas=document.getElementById('stars');const sCtx=sCanvas.getContext('2d');
let SW=0,SH=0,stars=[],planet={};
function initStars(){SW=sCanvas.width=window.innerWidth;SH=sCanvas.height=window.innerHeight;
  const count=Math.min(420,Math.floor((SW*SH)/5500));
  stars=Array.from({length:count},()=>({x:Math.random()*SW,y:Math.random()*SH,r:Math.random()*1.5+0.3,base:Math.random()*0.5+0.25,speed:Math.random()*0.9+0.2,phase:Math.random()*Math.PI*2,hue:Math.random()<0.82?'cool':(Math.random()<0.5?'warm':'pink')}));
  planet={x:SW*0.84,y:SH*0.28,r:Math.min(SW,SH)*0.42};}
const t0=performance.now();
function starsFrame(now){const t=(now-t0)/1000;sCtx.clearRect(0,0,SW,SH);
  const{x,y,r}=planet;
  const glow=sCtx.createRadialGradient(x,y,r*0.75,x,y,r*1.8);
  glow.addColorStop(0,'rgba(124,86,232,0.32)');glow.addColorStop(0.5,'rgba(255,79,216,0.06)');glow.addColorStop(1,'rgba(124,86,232,0)');
  sCtx.fillStyle=glow;sCtx.beginPath();sCtx.arc(x,y,r*1.8,0,Math.PI*2);sCtx.fill();
  const body=sCtx.createRadialGradient(x-r*0.5,y-r*0.5,r*0.05,x,y,r);
  body.addColorStop(0,'#8a6ce8');body.addColorStop(0.45,'#3b2a86');body.addColorStop(1,'#0d0820');
  sCtx.fillStyle=body;sCtx.beginPath();sCtx.arc(x,y,r,0,Math.PI*2);sCtx.fill();
  sCtx.strokeStyle='rgba(79,227,255,0.35)';sCtx.lineWidth=1.2;sCtx.beginPath();sCtx.arc(x,y,r,0,Math.PI*2);sCtx.stroke();
  const mx=x+r*1.1+Math.cos(t*0.1)*10,my=y-r*0.7+Math.sin(t*0.1)*10;
  sCtx.fillStyle='rgba(200,220,255,0.8)';sCtx.beginPath();sCtx.arc(mx,my,5,0,Math.PI*2);sCtx.fill();
  sCtx.fillStyle='rgba(200,220,255,0.15)';sCtx.beginPath();sCtx.arc(mx,my,14,0,Math.PI*2);sCtx.fill();
  for(const s of stars){const tw=s.base+Math.sin(t*s.speed+s.phase)*0.35;sCtx.globalAlpha=Math.max(0.06,tw);
    sCtx.fillStyle=s.hue==='cool'?'#cfe9ff':s.hue==='warm'?'#ffd8a8':'#ffc0e8';
    sCtx.beginPath();sCtx.arc(s.x,s.y,s.r,0,Math.PI*2);sCtx.fill();}
  sCtx.globalAlpha=1;requestAnimationFrame(starsFrame);}
window.addEventListener('resize',initStars);initStars();requestAnimationFrame(starsFrame);

/* ---------- Menu motes ---------- */
const mCanvas=document.getElementById('menuParticles');const mCtx=mCanvas.getContext('2d');
let mW=0,mH=0,motes=[];
function initMotes(){mW=mCanvas.width=window.innerWidth;mH=mCanvas.height=window.innerHeight;
  motes=Array.from({length:55},()=>({x:Math.random()*mW,y:Math.random()*mH,r:Math.random()*2.5+0.8,vx:(Math.random()-0.5)*0.25,vy:-(Math.random()*0.4+0.1),hue:Math.random()<0.5?'#4fe3ff':'#ff4fd8',phase:Math.random()*Math.PI*2}));}
function motesFrame(now){const t=(now-t0)/1000;mCtx.clearRect(0,0,mW,mH);
  for(const m of motes){m.x+=m.vx+Math.sin(t*0.6+m.phase)*0.15;m.y+=m.vy;
    if(m.y<-10){m.y=mH+10;m.x=Math.random()*mW;}
    if(m.x<-10)m.x=mW+10; if(m.x>mW+10)m.x=-10;
    mCtx.globalAlpha=0.35+Math.sin(t+m.phase)*0.25;mCtx.fillStyle=m.hue;mCtx.shadowColor=m.hue;mCtx.shadowBlur=12;
    mCtx.beginPath();mCtx.arc(m.x,m.y,m.r,0,Math.PI*2);mCtx.fill();}
  mCtx.shadowBlur=0;mCtx.globalAlpha=1;requestAnimationFrame(motesFrame);}
window.addEventListener('resize',initMotes);initMotes();requestAnimationFrame(motesFrame);

/* ---------- Preview ---------- */
function updatePreview(){const p=state.profile;const wrap=document.getElementById('previewAvatarWrap');
  wrap.style.setProperty('--pc',p.color);const av=wrap.querySelector('.avatar');av.style.setProperty('--c',p.color);av.innerHTML=alienSVG();
  document.getElementById('previewName').textContent=p.name;
  document.getElementById('previewMeta').textContent=`${p.age} éves · ${p.body}`;
  document.getElementById('previewTraits').innerHTML=Object.entries(TRAIT_LABELS).map(([k,l])=>`<div class="t"><div><div class="name">${l}</div><div class="track"><div class="fill" style="width:${p.traits[k]}%"></div></div></div><div class="v">${p.traits[k]}</div></div>`).join('');}
document.getElementById('btnEditProfile').onclick=()=>openScreen('profile');

/* ---------- Modal ---------- */
const layer=document.getElementById('screenLayer');const panel=document.getElementById('screenPanel');const SCREENS={};
function openScreen(key,opts={}){const def=SCREENS[key];if(!def){toast('Ez a képernyő még fejlesztés alatt áll.');return;}
  const built=def.build(opts);
  panel.innerHTML=`<button class="screen-close" data-close aria-label="Bezárás">✕</button><div class="screen-title">${built.title}</div>${built.html}`;
  layer.classList.add('open');layer.setAttribute('aria-hidden','false');
  panel.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeScreen);
  if(built.mount)built.mount(panel);}
function closeScreen(){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');updatePreview();}
layer.addEventListener('click',e=>{if(e.target===layer)closeScreen();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeScreen();});
function bindChipRow(row,multi=false){if(!row)return;
  row.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
    if(multi)b.classList.toggle('active');
    else{row.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));b.classList.add('active');}});}
function selectedChips(row){return [...row.querySelectorAll('.chip.active')].map(c=>c.dataset.value);}
document.getElementById('mainMenu').addEventListener('click',e=>{const btn=e.target.closest('.menu-btn');if(!btn)return;openScreen(btn.dataset.screen,{mode:btn.dataset.mode});});

/* ---------- New game ---------- */
SCREENS['new-game']={build(opts={}){const mode=opts.mode||'offline';return{title:'Új játék',html:`
  <div class="screen-head"><h2>Új város alapítása</h2>
    <p>Válaszd ki a körülményeket, majd alapítsd meg Xenora új telepesvárosát. Az épületek különböző méretűek – a nagyobbak több helyet foglalnak.</p></div>
  <div class="screen-body">
    <label class="field"><span class="field-label">Város neve</span>
      <input type="text" id="cityName" value="Új Xenora" maxlength="24" /></label>
    <div class="field"><span class="field-label">Játékmód</span>
      <div class="chip-row" id="modeRow">
        <button type="button" class="chip ${mode==='offline'?'active':''}" data-value="offline">Offline</button>
        <button type="button" class="chip ${mode==='online'?'active':''}" data-value="online">Online</button>
      </div></div>
    <div class="field"><span class="field-label">Bolygótípus</span>
      <div class="chip-row" id="bioRow">
        <button type="button" class="chip active" data-value="mérsékelt">🌿 Mérsékelt</button>
        <button type="button" class="chip" data-value="sivatagi">🏜 Sivatagi</button>
        <button type="button" class="chip" data-value="óceáni">🌊 Óceáni</button>
        <button type="button" class="chip" data-value="jeges">❄ Jeges</button>
      </div></div>
    <div class="field"><span class="field-label">Város mérete</span>
      <div class="chip-row" id="sizeRow">
        <button type="button" class="chip" data-value="24">Kicsi · 24×24</button>
        <button type="button" class="chip active" data-value="32">Közepes · 32×32</button>
        <button type="button" class="chip" data-value="40">Nagy · 40×40</button>
      </div></div>
  </div>
  <div class="screen-foot"><button class="btn ghost" data-close>Mégse</button>
    <button class="btn primary" id="startGame">Város alapítása</button></div>`,
  mount(root){['#modeRow','#bioRow','#sizeRow'].forEach(s=>bindChipRow(root.querySelector(s)));
    root.querySelector('#startGame').onclick=()=>{
      const name=root.querySelector('#cityName').value.trim()||'Névtelen';
      const size=+selectedChips(root.querySelector('#sizeRow'))[0]||32;
      const bio=selectedChips(root.querySelector('#bioRow'))[0]||'mérsékelt';
      closeScreen();startGame({name,size,bio});};}};}};

SCREENS['load']={build(){const slots=state.saveSlots;return{title:'Betöltés',
  html:slots.length?`<div class="screen-body">${slots.map(s=>`<button class="menu-btn"><span class="icon">◈</span><span class="text"><span class="label">${s.name}</span><span class="hint">${s.info}</span></span><span class="arrow">›</span></button>`).join('')}</div><div class="screen-foot"><button class="btn ghost" data-close>Bezárás</button></div>`:`<div class="empty-state"><span class="big">◌</span>Még nincs mentett városod.<br>Alapíts egyet az „Új játék" menüben!</div><div class="screen-foot"><button class="btn ghost" data-close>Bezárás</button></div>`,mount(){}};}};

function traitSlider(key,label,val){return `<div class="slider-row"><label for="t_${key}">${label}</label>
  <input type="range" id="t_${key}" data-trait="${key}" min="0" max="100" value="${val}" />
  <output id="o_${key}">${val}</output></div>`;}
SCREENS['profile']={build(){const p=state.profile;return{title:'Profil',html:`
  <div class="screen-head"><h2>Profil készítő</h2>
    <p>Ez a karakter képvisel majd Xenorán. Amikor nem irányítod, önállóan éli a mindennapjait.</p></div>
  <div class="profile-layout">
    <aside class="profile-preview">
      <div class="avatar" id="avatar" style="--c:${p.color}">${alienSVG()}</div>
      <h3 id="pName">${p.name}</h3><p class="dim" id="pMeta">${p.age} éves · ${p.body}</p>
      <div class="trait-bars" id="traitBars"></div></aside>
    <div class="profile-form">
      <label class="field"><span class="field-label">Név</span>
        <input type="text" id="pNameInput" value="${p.name}" maxlength="20" /></label>
      <div class="field"><span class="field-label">Életkor</span>
        <div class="slider-row"><label for="pAge">Kor</label>
          <input type="range" id="pAge" min="18" max="80" value="${p.age}" />
          <output id="pAgeOut">${p.age}</output></div></div>
      <div class="field"><span class="field-label">Testfelépítés</span>
        <div class="chip-row" id="bodyRow">
          <button type="button" class="chip" data-value="Karcsú">Karcsú</button>
          <button type="button" class="chip active" data-value="Közepes">Közepes</button>
          <button type="button" class="chip" data-value="Robusztus">Robusztus</button>
        </div></div>
      <div class="field"><span class="field-label">Vonzalom (több is választható)</span>
        <div class="chip-row" id="orientRow">
          <button type="button" class="chip active" data-value="Nőkre">Nőkre</button>
          <button type="button" class="chip" data-value="Férfiakra">Férfiakra</button>
          <button type="button" class="chip active" data-value="Mindenkire">Mindenkire</button>
          <button type="button" class="chip" data-value="Senkire">Senkire</button>
        </div></div>
      <div class="field"><span class="field-label">Tulajdonságok</span>
        <div class="sliders">
          ${traitSlider('nyitottsag',TRAIT_LABELS.nyitottsag,p.traits.nyitottsag)}
          ${traitSlider('szocialis',TRAIT_LABELS.szocialis,p.traits.szocialis)}
          ${traitSlider('ambicio',TRAIT_LABELS.ambicio,p.traits.ambicio)}
          ${traitSlider('nyugalom',TRAIT_LABELS.nyugalom,p.traits.nyugalom)}
        </div></div>
      <div class="field"><span class="field-label">Karakter színe</span>
        <input type="color" id="pColor" value="${p.color}" /></div>
    </div>
  </div>
  <div class="screen-foot"><button class="btn ghost" data-close>Mégse</button>
    <button class="btn primary" id="saveProfile">Profil mentése</button></div>`,
  mount(root){
    const nameInput=root.querySelector('#pNameInput'),ageInput=root.querySelector('#pAge');
    const ageOut=root.querySelector('#pAgeOut'),colorInput=root.querySelector('#pColor');
    const avatar=root.querySelector('#avatar'),pName=root.querySelector('#pName'),pMeta=root.querySelector('#pMeta');
    const bodyRow=root.querySelector('#bodyRow'),orientRow=root.querySelector('#orientRow'),bars=root.querySelector('#traitBars');
    bindChipRow(bodyRow);bindChipRow(orientRow,true);
    orientRow.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',p.orientation.includes(c.dataset.value)));
    function renderBars(){bars.innerHTML=Object.entries(TRAIT_LABELS).map(([k,l])=>`
      <div class="trait"><span class="trait-name">${l}</span>
        <span class="trait-track"><span class="trait-fill" style="width:${p.traits[k]}%"></span></span>
        <span class="trait-val">${p.traits[k]}</span></div>`).join('');}
    function refreshMeta(){pName.textContent=p.name;pMeta.textContent=`${p.age} éves · ${p.body}`;}
    renderBars();refreshMeta();
    nameInput.addEventListener('input',()=>{p.name=nameInput.value||'Névtelen';refreshMeta();});
    ageInput.addEventListener('input',()=>{p.age=+ageInput.value;ageOut.textContent=p.age;refreshMeta();});
    colorInput.addEventListener('input',()=>{p.color=colorInput.value;avatar.style.setProperty('--c',p.color);});
    bodyRow.addEventListener('click',()=>{p.body=selectedChips(bodyRow)[0];refreshMeta();});
    root.querySelectorAll('input[data-trait]').forEach(inp=>{
      inp.addEventListener('input',()=>{const k=inp.dataset.trait;p.traits[k]=+inp.value;root.querySelector(`#o_${k}`).textContent=inp.value;renderBars();});});
    root.querySelector('#saveProfile').onclick=()=>{p.orientation=selectedChips(orientRow);if(!p.orientation.length)p.orientation=['Mindenkire'];toast(`Profil mentve: ${p.name}`);closeScreen();};
  }};}};

SCREENS['settings']={build(){const s=state.settings;return{title:'Beállítások',html:`
  <div class="screen-head"><h2>Beállítások</h2><p>Hang, megjelenítés és játékmenet.</p></div>
  <div class="screen-body">
    <div class="field"><span class="field-label">Hang</span>
      <div class="sliders">
        <div class="slider-row"><label for="sMusic">Zene</label>
          <input type="range" id="sMusic" min="0" max="100" value="${s.music}" />
          <output id="sMusicOut">${s.music}</output></div>
        <div class="slider-row"><label for="sSfx">Hangeffektek</label>
          <input type="range" id="sSfx" min="0" max="100" value="${s.sfx}" />
          <output id="sSfxOut">${s.sfx}</output></div>
      </div></div>
    <div class="field"><span class="field-label">Grafikai minőség</span>
      <div class="chip-row" id="qualRow">
        <button type="button" class="chip" data-value="alacsony">Alacsony</button>
        <button type="button" class="chip ${s.quality==='közepes'?'active':''}" data-value="közepes">Közepes</button>
        <button type="button" class="chip ${s.quality==='magas'?'active':''}" data-value="magas">Magas</button>
      </div></div>
    <div class="field"><span class="field-label">Idő sebessége</span>
      <div class="chip-row" id="timeRow">
        <button type="button" class="chip ${s.timeSpeed===0.5?'active':''}" data-value="0.5">Lassú</button>
        <button type="button" class="chip ${s.timeSpeed===1?'active':''}" data-value="1">Normál</button>
        <button type="button" class="chip ${s.timeSpeed===2?'active':''}" data-value="2">Gyors</button>
      </div></div>
  </div>
  <div class="screen-foot"><button class="btn ghost" data-close>Bezárás</button>
    <button class="btn primary" id="saveSettings">Mentés</button></div>`,
  mount(root){['#qualRow','#timeRow'].forEach(sl=>bindChipRow(root.querySelector(sl)));
    const m=root.querySelector('#sMusic'),f=root.querySelector('#sSfx');
    m.addEventListener('input',()=>root.querySelector('#sMusicOut').textContent=m.value);
    f.addEventListener('input',()=>root.querySelector('#sSfxOut').textContent=f.value);
    root.querySelector('#saveSettings').onclick=()=>{
      state.settings.music=+m.value;state.settings.sfx=+f.value;
      state.settings.quality=selectedChips(root.querySelector('#qualRow'))[0]||'közepes';
      state.settings.timeSpeed=+selectedChips(root.querySelector('#timeRow'))[0]||1;
      toast('Beállítások elmentve.');closeScreen();};}};}};

SCREENS['online']={build(){return{title:'Online',html:`

/* ---------- Start game ---------- */
function startGame({name,size,bio}){

  game.money=9000;game.selected='road';game.selectedCat='road';game.hovered={x:-1,y:-1};

  game.cars=[];game.birds=[];game.buildFx=[];game.lamps=[];
  game.weather='clear';game.weatherIntensity=0;

  game.tiles=[];
  for(let y=0;y<size;y++){const row=[];
    for(let x=0;x<size;x++)row.push({type:'empty',pop:0,ch:0,detail:Math.random(),detail2:Math.random(),detail3:Math.random()});
    game.tiles.push(row);}

  game.nature=[];
  const treeCount=Math.floor(size*size*0.075);
  for(let i=0;i<treeCount;i++){
    const x=Math.floor(Math.random()*size),y=Math.floor(Math.random()*size);
    const t=game.tiles[y][x];
    if(t.type==='empty'&&!game.nature.find(n=>n.x===x&&n.y===y)){
      const kind=Math.random()<0.78?'tree':'rock';
      game.nature.push({x,y,kind,size:0.7+Math.random()*0.7,seed:Math.random(),sway:Math.random()*Math.PI*2});}}

  for(let i=0;i<7;i++){
    game.clouds.push({
      x:Math.random()*size*TW*2-size*TW/2,y:Math.random()*size*TH-size*TH/2,
      size:80+Math.random()*140,speed:0.15+Math.random()*0.15,alpha:0.05+Math.random()*0.07});}
  for(let i=0;i<8;i++)spawnBird(true);

  for(let i=0;i<3;i++){
    const x=Math.floor(Math.random()*(size-3))+1;
    const y=Math.floor(Math.random()*(size-3))+1;

      placeBuilding(x,y,'house_small');

function fitCamera(){const gw=game.grid*TW,gh=game.grid*TH;const pad=100;

function screenToTile(sx,sy){const wx=(sx-cam.x)/cam.zoom,wy=(sy-cam.y)/cam.zoom;
  return {x:Math.round(wx/TW+wy/TH),y:Math.round(wy/TH-wx/TW)};}
function tileCenter(x,y){return {cx:(x-y)*TW/2,cy:(x+y)*TH/2};}

/* ---------- Placement helpers ---------- */
function canPlace(x,y,size){
  if(x<0||y<0||x+size>game.grid||y+size>game.grid)return false;
  for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++){
    if(game.tiles[y+dy][x+dx].type!=='empty')return false;}
  return true;
}
function placeBuilding(fx,fy,bkey){
  const def=BUILDINGS[bkey];if(!def)return;
  const size=def.size||1;
  game.money-=def.cost;
  for(let dy=0;dy<size;dy++)for(let dx=0;dx<size;dx++){
    const t=game.tiles[fy+dy][fx+dx];
    t.type='occupied';t.footX=fx;t.footY=fy;t.size=size;t.bkey=bkey;t.pop=0;
    game.nature=game.nature.filter(n=>!(n.x===fx+dx&&n.y===fy+dy));
  }
  const anchor=game.tiles[fy+size-1][fx+size-1];
  anchor.type=def.kind;anchor.ch=0;anchor.variant=def.v||0;
  game.buildFx.push({x:fx+(size-1)/2,y:fy+(size-1)/2,t:0,dur:0.8});
  if(def.kind==='park'){for(let i=0;i<size*2;i++)spawnAnimal(fx+(size-1)/2,fy+(size-1)/2);}
  if(def.kind==='road')maybeAddLamp(fx,fy);
}
